<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>{{ 'SETTINGS.TITLE' | transloco }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">{{ 'SETTINGS.TITLE' | transloco }}</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-list [inset]="true">
    <ion-item>
      <ion-select
        [label]="'SETTINGS.LANGUAGE' | transloco"
        interface="popover"
        [value]="language.current()"
        (ionChange)="onLanguageChange($event)"
      >
        @for (option of language.options; track option.code) {
          <ion-select-option [value]="option.code">{{ option.name }}</ion-select-option>
        }
      </ion-select>
    </ion-item>
  </ion-list>
</ion-content>
