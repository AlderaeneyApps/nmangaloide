<ion-app>
  <ion-router-outlet id="main-content"></ion-router-outlet>
  @if (showBottomBar()) {
    <ion-tab-bar slot="bottom" [selectedTab]="selectedTab()">
      @for (p of bottomPages; track p.url) {
        <ion-tab-button
          [tab]="p.url"
          [routerDirection]="p.url === '/' ? 'root' : 'forward'"
          [routerLink]="[p.url]"
          [replaceUrl]="p.url !== '/' && onTopLevelPage()"
        >
          <ion-icon aria-hidden="true" [ios]="p.icon + '-outline'" [md]="p.icon + '-sharp'"></ion-icon>
          <ion-label>{{ p.title | transloco }}</ion-label>
        </ion-tab-button>
      }
    </ion-tab-bar>
  }
</ion-app>
