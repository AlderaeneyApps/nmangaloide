<ion-card class="gallery-card">
  <div class="cover" [style.aspect-ratio]="aspectRatio()">
    @if (imageUrl(); as url) {
      <img [src]="url" [alt]="title()" loading="lazy" decoding="async" />
    }
    @if (flagSrc(); as flag) {
      <img
        class="language-flag"
        [src]="flag"
        [alt]="'CARD.LANGUAGE.' + flagLanguage() | transloco"
        [title]="'CARD.LANGUAGE.' + flagLanguage() | transloco"
        [attr.data-language]="flagLanguage()"
      />
    }
  </div>
  <!-- Screen readers get the full title once, from the cover's alt text, not this shortened
       copy (which they read when there's no cover to show). -->
  <p class="title" [title]="title()" [attr.aria-hidden]="imageUrl() ? 'true' : null">{{ shortTitle() }}</p>
</ion-card>
