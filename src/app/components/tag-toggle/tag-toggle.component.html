<button
  type="button"
  class="tag-toggle"
  [class.enabled]="state() === 'enabled'"
  [class.disabled]="state() === 'disabled'"
  [disabled]="disabled()"
  [attr.aria-label]="name() + (kind() ? ' (' + kind() + ')' : '') + ', ' + (stateKey() | transloco)"
  (click)="cycle.emit()"
>
  <ion-icon [name]="icon()" aria-hidden="true"></ion-icon>
  <span class="text">
    <span class="name">{{ name() }}</span>
    @if (kind()) {
      <span class="kind">{{ kind() }}</span>
    }
  </span>
  @if (count() !== null) {
    <span class="count">{{ count() }}</span>
  }
</button>
